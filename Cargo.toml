[package]
name = "wontopos"
version = "2.2.42"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Wontopos — long-term memory for AI agents. Identical recall in every language, ~100× lower LLM bill."
homepage = "https://wontopos.com"
repository = "https://github.com/wontopos/wontopos-rust"
readme = "README.md"
exclude = ["examples/fuzz_shapes.rs"]
keywords = ["memory", "ai", "agent", "llm", "multilingual"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
futures-util = "0.3"
# Tiny, dependency-free HTTP-date parser (also used transitively by reqwest) —
# lets retry_wait() honor a `Retry-After` given as an HTTP-date, not just seconds.
httpdate = "1"

# SDK is a standalone crate — kept out of the workspace so it can be published independently.
[workspace]
